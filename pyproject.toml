[project]
name = "openhrefs"
version = "0.0.0"
description = "Open-source domain authority and backlink index over CommonCrawl data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5,<4",
    "structlog>=24.1",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "tldextract>=5.3.1",
    "idna>=3.16",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "chispa>=0.10",
    "sqlfluff>=3.1",
    "pre-commit>=3.7",
    "yamllint>=1.35",
    "types-pyyaml>=6.0",
    "dbt-core>=1.11.11",
    "dbt-duckdb>=1.10.1",
    "dbt-spark[session]>=1.10.1",
    "sqlfluff-templater-dbt>=4.2.1",
    "scipy>=1.17.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["N812"]  # pyspark convention: `from pyspark.sql import functions as F`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["spark_jobs.*.transforms", "spark_jobs.*.transforms.*", "spark_jobs.common.pagerank"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
